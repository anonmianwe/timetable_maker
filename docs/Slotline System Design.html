*{box-sizing:border-box}

<script type="text/plain" id="rules-md"># กติกาสำหรับ AI ที่สร้างเว็บไซต์ Slotline (ระบบจัดตารางสอนอัตโนมัติ)

ไฟล์นี้เขียนให้ AI โมเดลเล็กอ่าน ทำตามทุกข้อ ไม่ตีความเอง
ถ้าสองข้อขัดกัน ให้ยึดข้อที่อยู่หมวดเลขน้อยกว่า
คำสำคัญ: MUST = ต้องทำ · NEVER = ห้ามทำเด็ดขาด · STOP = หยุดทำงานแล้วถามคน

## 0. วิธีใช้ไฟล์นี้

0.1 MUST อ่านทั้งไฟล์ก่อนเริ่มทุกงาน
0.2 MUST ทำทีละงาน ทีละไฟล์ ไม่ทำหลายอย่างพร้อมกัน
0.3 MUST ส่งไฟล์ที่แก้ทั้งไฟล์ ไม่ส่งเฉพาะชิ้นส่วน
0.4 ถ้าไม่แน่ใจ ให้ STOP ไม่ต้องเดา

## 1. ข้อห้ามเด็ดขาด (NEVER)

N1 NEVER ฝังเงื่อนไขการจัดตารางในโค้ด ได้แก่ เลขคาบ วัน ชื่อห้อง ชื่อครู ช่วงชั่วโมงสอน
   ค่าเหล่านี้มาจาก rules.json หรือฐานข้อมูลเท่านั้น
   ผิด: `if (period > 9)` ถูก: `if (period > rules.maxPeriodByLevel[level])`
N2 NEVER แต่งข้อมูลเอง (วิชา ครู ห้อง ตาราง) ถ้าไม่มีข้อมูล ให้แสดงหน้าว่างเป็นภาษาไทยแล้ว STOP
N3 NEVER แสดงตารางที่ status ไม่ใช่ "verified" ในหน้านักเรียนและครู
   หน้า admin แสดงได้ แต่ต้องมีป้าย "ยังไม่ผ่านการตรวจ"
N4 NEVER ตรวจความขัดแย้งในโค้ดหน้าเว็บ ให้เรียก GET /api/runs/:id/verify เท่านั้น
N5 NEVER แก้ฟิลด์ใน packages/contract โดยไม่เพิ่ม schemaVersion และไม่เพิ่มเทสต์
N6 NEVER โหลดไฟล์จากอินเทอร์เน็ตตอนระบบทำงาน (CDN ฟอนต์ออนไลน์ รูป API ภายนอก) ยกเว้นผู้ให้บริการ AI ภาษาที่เปิดใช้เองตาม N24
   ระบบต้องทำงานได้เมื่อไม่มีอินเทอร์เน็ต ฟอนต์ใช้ @fontsource ที่ติดตั้งในโปรเจกต์
N7 NEVER เก็บรหัสผ่านเป็นข้อความเปล่า, ใส่ secret ในโค้ด, หรือ commit ไฟล์ .env
N8 NEVER ต่อสตริงเป็น SQL ใช้ parameter ($1, $2) หรือ query builder เท่านั้น
N9 NEVER ใช้ `any`, `@ts-ignore`, `eslint-disable`, `as unknown as` เพื่อซ่อนปัญหา
N10 NEVER กลืน error ด้วย catch เปล่า ต้องแสดงข้อความไทยพร้อมรหัส เช่น E-IMP-001
N11 NEVER ทิ้ง TODO, "...", lorem ipsum, ฟังก์ชันว่าง, หรือข้อมูลปลอมในไฟล์ที่ส่งมอบ
N12 NEVER บอกว่า "เสร็จแล้ว" ก่อนรันคำสั่งตรวจในหมวด 9 และแปะผลจริงของคำสั่ง
N13 NEVER ใช้ Math.random() ใน packages/solver ให้ใช้ตัวสุ่มที่รับ seed และบันทึก seed ในผลทุกครั้ง
N14 NEVER แสดงตัวเลขหรือกราฟที่ไม่ได้มาจากระบบจริงโดยไม่ติดป้าย "ตัวอย่าง"
   แถบ progress ต้องใช้ค่าจริงจากเซิร์ฟเวอร์ ห้ามทำให้วิ่งหลอก
N15 NEVER ลบ เปลี่ยนชื่อ หรือย้ายไฟล์ที่ไม่ได้อยู่ในงานที่สั่ง
N16 NEVER เพิ่มไลบรารี เปลี่ยนเวอร์ชัน หรือเปลี่ยน stack โดยไม่ถาม (STOP)
N17 NEVER ตัดข้อความไทยด้วย ellipsis ในช่องตารางเวลา ให้ขึ้นบรรทัดใหม่แทน
N18 NEVER ใส่ animation ที่ไม่รองรับ prefers-reduced-motion
N19 NEVER ให้ packages/verifier import จาก packages/solver (ตัวตรวจต้องเป็นอิสระ)
N20 NEVER ให้ packages/solver import express หรือแตะฐานข้อมูล (solver เป็นฟังก์ชันบริสุทธิ์)

N21 NEVER เปลี่ยนชื่อแผ่นงาน หัวคอลัมน์ ลำดับคอลัมน์ หรือค่าในไฟล์ส่งออก Excel (หมวด 4 ข้อ C14)
   กรรมการตรวจไฟล์นี้ด้วยโปรแกรม ผิดตัวอักษรเดียวถือว่าไม่ผ่าน
N22 NEVER ให้การจัดตารางค้าง ต้องมีเพดานงาน (จำนวนรอบ) และเช็กการยกเลิกทุก N รอบ
   ถ้าจัดไม่ได้หรือหมดเพดาน MUST ตอบสถานะและเหตุผล ห้ามเงียบ
N23 NEVER ให้ผลต่าง seed เดียวกัน ข้อมูลเดียวกัน ค่าตั้งค่าเดียวกัน
   ห้ามใช้เวลาจริง (Date.now) เป็นตัวหยุดหรือตัวตัดสินใจของ solver ให้ใช้จำนวนรอบเท่านั้น
N24 NEVER ทำให้ระบบต้องพึ่ง AI ภาษา (LLM) หรืออินเทอร์เน็ตเพื่อทำงานหลัก
   การอ่านคำขอพิเศษต้องมีตัวอ่านแบบกฎในเครื่อง และฟอร์มกรอกเอง เป็นทางสำรองเสมอ
   ผลจาก AI ทุกครั้งต้องผ่าน Zod และให้ผู้ใช้กดยืนยันก่อนใช้

## 2. ข้อเท็จจริงของโครงการ

F1 โจทย์: ระบบจัดตารางสอนอัตโนมัติ ระดับ ปวส. กรรมการให้ไฟล์ Excel 2 ชุดโครงสร้างเดียวกัน
   ชุดทดลอง 4 กลุ่มเรียน (ตรวจด้วยตา) และชุดหลัก 12 กลุ่มเรียน (ลองเมื่อเว็บทำงานแล้ว)
   ชุดใหญ่ทดสอบประมาณ 600 รายการสอน ข้อมูลวันแข่งอาจต่างจากตัวอย่าง
F2 ไฟล์โจทย์มี 7 แผ่นงาน: ครู (รหัส ชื่อ แผนก คาบสูงสุดต่อวัน), เวลาที่ครูไม่สะดวก,
   ห้อง (ประเภท ความจุ), กลุ่มเรียน (จำนวนนักเรียน), รายวิชา (ท-ป-น และห้องปฏิบัติ),
   คำขอพิเศษภาษาไทย, รายการสอน (ทุกแถวต้องถูกจัดลงตาราง)
F3 รายการสอนหนึ่งรายการแตกเป็นสูงสุด 2 ครั้งที่ต้องจัด: ทฤษฎี (ท คาบ ในห้องบรรยาย)
   และปฏิบัติ (ป คาบติดกันในห้องปฏิบัติของวิชา) ถ้า ป = 0 ไม่ต้องจัดปฏิบัติ
   ตัวอย่าง ท-ป-น 1-4-3 = ทฤษฎี 1 คาบ + ปฏิบัติ 4 คาบติดกันในห้องคอมพิวเตอร์
F4 เรียนรวมหลายกลุ่ม: ทุกกลุ่มต้องว่างพร้อมกัน และห้องต้องจุนักเรียนรวมทุกกลุ่ม
F5 ครู กลุ่ม และห้อง ต้องว่างในทุกครั้งที่จัด และครูต้องไม่เกินคาบสูงสุดต่อวัน
F6 สัปดาห์ = จันทร์–ศุกร์ เก็บเป็น day 1–5 คาบเริ่มที่ 1 ค่าตั้งต้นคาบละ 60 นาที คาบ 1 เริ่ม 08:30
   (ข้อสมมติ รอกรรมการยืนยัน) กฎใน "แนวทางปฏิบัติ" ฉบับ ปวช. (เช่น ปวช.1 ไม่เกินคาบ 9
   พักกลางวัน 1 ชม. กิจกรรมพฤหัสคาบ 6–7 ภาระครู 24–38 ชม.) ใส่เป็นกฎใน rules.json
   ทีละข้อ และตรวจกับไฟล์จริงว่าใช้กับข้อมูลชุดนี้หรือไม่ ห้ามเปิดใช้โดยไม่ยืนยัน
F7 ผู้ใช้มี 3 บทบาท: admin (กรรมการ/ผู้จัดตาราง), teacher, student
F8 เว็บมี 6 หน้าให้กรรมการกดตรวจเอง (หมวด 6) หน้าจัดตารางคะแนนสูงสุด 25 จาก 83
F9 คำขอพิเศษมี 3 แบบ: ต้องทำตาม (hard) · ทำถ้าทำได้ (soft) · ไม่ต้องทำอะไรเพิ่ม
   (จริงอยู่แล้ว หรืออ้างถึงครูที่ไม่มีในข้อมูล) เพิ่มคำขอใหม่ได้โดยไม่แก้โค้ด

### Stack (ห้ามเปลี่ยน)

| ส่วน | เครื่องมือ |
|---|---|
| หน้าเว็บ | React 18, TypeScript strict, Vite, React Router, TanStack Query, Zod |
| ตกแต่ง | CSS Modules + CSS variables (design tokens) ไม่ใช้ Tailwind |
| Motion | ไลบรารี `motion` (React) สำหรับ layout/enter/exit, CSS สำหรับ hover และ micro-interaction |
| ลากวาง | dnd-kit |
| กราฟ | SVG เขียนเองด้วย d3-scale และ d3-shape |
| API | Node 22 LTS, Express 5, JavaScript ESM + JSDoc (ตรวจชนิดด้วย `tsc --checkJs`), Zod, pino |
| ความปลอดภัย/อัปโหลด/ฐานข้อมูล | argon2 (แฮชรหัสผ่าน), jose (JWT), multer (อัปโหลด), pg (PostgreSQL) |
| Solver | JavaScript ล้วน รันใน worker_threads |
| ฐานข้อมูล | PostgreSQL 16 ผ่าน `pg` (query แบบ parameter) |
| Excel | ExcelJS (อ่านและเขียน) |
| PDF | Puppeteer พิมพ์จากหน้า HTML+CSS ใน templates/print |
| ทดสอบ | Vitest, Testing Library, supertest, Playwright |
| รัน | docker compose up |

### โครงโฟลเดอร์ (ห้ามสร้างนอกโครงนี้)

```
slotline/
  apps/web/            React + TypeScript
  apps/api/            Express 5
  packages/contract/   Zod schema, JSON Schema, ไฟล์ตัวอย่าง
  packages/rules/      ฟังก์ชัน check ของแต่ละกฎ
  packages/solver/     อัลกอริทึมจัดตาราง
  packages/verifier/   ตัวตรวจอิสระ
  templates/print/     HTML + CSS สำหรับ PDF
  docker-compose.yml
```

## 3. ลำดับทำงานทุกครั้ง

W1 READ อ่านงานที่สั่งและไฟล์ที่เกี่ยวข้อง ห้ามอ่านทั้งโปรเจกต์
W2 PLAN เขียนแผนไม่เกิน 5 บรรทัด ระบุชื่อไฟล์ที่จะแก้ทุกไฟล์
W3 ONE แก้ครั้งละเรื่องเดียว ไม่เกิน 3 ไฟล์ต่อรอบ
W4 TEST เขียนเทสต์ก่อนหรือพร้อมโค้ด
W5 RUN รันคำสั่งตรวจหมวด 9
W6 REPORT รายงานตามแบบหมวด 11
W7 ถ้าคำสั่งตรวจล้มเหลว ให้แก้ไม่เกิน 3 รอบ ถ้ายังล้มเหลว STOP พร้อมแปะ error เต็ม

## 4. Data contract (สัญญาข้อมูล)

C1 ข้อมูลเข้าและออกของ solver ใช้รูปแบบใน packages/contract เท่านั้น
C2 ทุกไฟล์ที่รับเข้าระบบ MUST ผ่าน Zod parse ก่อนใช้ ถ้าไม่ผ่านให้ตอบ 422 พร้อมรายการฟิลด์ที่ผิด
C3 MUST มีฟิลด์ `schemaVersion` ใน problem.json และ solution.json
C4 id ทุกตัวเป็น string และห้ามเปลี่ยนค่าหลังสร้าง
C5 วันใช้เลข 1–5 คาบใช้เลขเริ่มที่ 1 ห้ามเก็บเป็นข้อความ "จันทร์" ในข้อมูล แปลงเป็นข้อความเฉพาะตอนแสดงผล
C6 รหัสวิชา MUST ถูกทำให้เป็นรูปแบบเดียวก่อนเก็บ: ตัดช่องว่างรอบขีด "20000 - 1101" เป็น "20000-1101"
C7 ข้อความวัน "พฤหัส" และ "พฤหัสบดี" คือวันเดียวกัน ตัวนำเข้า MUST รองรับทั้งสองแบบ
C8 ตัวนำเข้า MUST รายงานทุกแถวที่อ่านไม่ได้ ห้ามข้ามเงียบ ๆ
C9 วิธีตอบข้อผิดพลาด: `{ "code": "E-XXX-000", "message": "ภาษาไทย", "details": [...] }`

C10 นำเข้า Excel ต้องตรวจทุกแผ่นงานในครั้งเดียว แล้วรายงานข้อผิดทั้งหมดพร้อมกัน
    แต่ละข้อผิดมี: แผ่นงาน, แถว, สิ่งที่ผิด, วิธีแก้ ห้ามหยุดที่ข้อผิดแรก
C11 ข้อมูลที่ต้องตรวจอย่างน้อย: รหัสซ้ำ, อ้างถึงรหัสที่ไม่มี, ท-ป-น ไม่ใช่ตัวเลข,
    กลุ่มที่ไม่มีห้องไหนจุพอ, ห้องปฏิบัติที่ไม่มีในแผ่นห้อง, ชั่วโมงรวมที่เกินช่องที่มี
C12 ข้อมูลยังไม่ถูกใช้จนกว่าผู้ใช้กดปุ่ม "ยืนยันใช้ข้อมูลนี้" (ขั้น preview แยกจากขั้น confirm)
C13 ระบบมีไฟล์แม่แบบเปล่า 1 ไฟล์ และไฟล์ตัวอย่างอย่างน้อย 3 ขนาด (เล็ก กลาง ใหญ่)
    ไฟล์ตัวอย่างสร้างด้วยสคริปต์ที่รับ seed ไม่เขียนมือ และต้องผ่านตัวนำเข้าของระบบเอง
C14 ไฟล์ส่งออก: แผ่นงานชื่อ "ตารางสอน" แถวแรกเป็นหัวคอลัมน์ 6 ช่อง ตามลำดับ:
    รหัสรายการสอน · ประเภท · วัน · คาบเริ่ม · จำนวนคาบ · รหัสห้อง
    หนึ่งแถว = หนึ่งครั้งที่จัด (ค่าประเภท: ทฤษฎี หรือ ปฏิบัติ) หนึ่งรายการสอนมี 1 หรือ 2 แถว
    ตรวจรูปแบบจริงจากไฟล์ตัวอย่างที่กรรมการให้ก่อนเขียนโค้ดส่วนนี้ ถ้ายังไม่มีไฟล์ STOP
C15 เทสต์ round-trip: ส่งออกแล้วอ่านกลับด้วยตัวตรวจอิสระ ต้องได้ผลตรวจเท่าเดิม

### API (ห้ามเปลี่ยนชื่อเส้นทาง)

| เมธอด | เส้นทาง | หน้าที่ |
|---|---|---|
| POST | /api/auth/login, /api/auth/refresh, /api/auth/logout | เข้าสู่ระบบ |
| GET | /api/templates/blank, /api/samples/:size | ไฟล์แม่แบบเปล่า และตัวอย่าง small, medium, large |
| POST | /api/import/preview | อ่านและตรวจไฟล์ ได้รายงานข้อผิดทั้งหมด ยังไม่ใช้ข้อมูล |
| POST | /api/import/:id/confirm | ยืนยันใช้ข้อมูลที่ตรวจผ่านแล้ว |
| GET, POST, PUT | /api/requests | คำขอพิเศษ: อ่าน เพิ่ม แก้ ยืนยัน |
| POST | /api/requests/parse | อ่านคำขอภาษาไทยเป็นเงื่อนไข (ตัวอ่านแบบกฎ หรือ AI ถ้าเปิด) |
| GET, PUT | /api/rules | อ่านและแก้ชุดกฎ |
| POST | /api/runs | สั่งจัดตาราง รับ seed ถ้าไม่ส่ง เซิร์ฟเวอร์สร้างและบันทึก |
| POST | /api/runs/:id/cancel | ยกเลิกกลางคัน |
| GET | /api/runs/:id | สถานะและคะแนน (เวลาที่ใช้ จำนวนที่จัดครบ จำนวนที่ชน) |
| GET | /api/runs/:id/explain | ลำดับที่จัดวิชา และเหตุผลสั้น ๆ ของแต่ละลำดับ |
| POST | /api/compare | รันวิธีพื้นฐานกับวิธีของทีมบนข้อมูลและ seed เดียวกัน |
| GET | /api/runs/:id/summary | ใช้ห้อง % · คาบสอนของครู · คาบว่างของกลุ่ม · ผลคำขอพิเศษ |
| GET | /api/runs/:id/events | SSE ความคืบหน้าจริง |
| GET | /api/runs/:id/verify | ผลตรวจ แยกตามกฎ |
| GET | /api/runs/:id/views/:kind/:key | ตารางแยกตาม group, teacher, room, subject |
| POST | /api/runs/:id/export | ส่งออก xlsx หรือ pdf |

สถานะของ run มีเพียง: queued, planning, solving, verifying, verified, infeasible, cancelled, failed
"verified" แปลว่าผ่านตัวตรวจและละเมิดกฎเด็ดขาด (hard) เป็นศูนย์เท่านั้น

## 5. ระบบกฎ (Rule engine)

R1 ทุกกฎมี id รูปแบบ `R-01`, ชนิด `hard` หรือ `soft`, และพารามิเตอร์เป็น JSON
R2 กฎ hard ละเมิดไม่ได้เลย กฎ soft เป็นคะแนนถ่วงน้ำหนัก ค่าน้ำหนักอยู่ใน rules.json
R3 การเพิ่มกฎใหม่ MUST ทำตามนี้ครบ: (1) เพิ่มฟังก์ชัน check ใน packages/rules
   (2) ลงทะเบียนใน registry (3) เทสต์กรณีผ่านหนึ่งข้อ (4) เทสต์กรณีไม่ผ่านหนึ่งข้อ
   (5) เพิ่มข้อความอธิบายภาษาไทยหนึ่งประโยค
R4 ห้ามแก้ฟังก์ชัน check ของกฎเดิมเพื่อให้เทสต์ผ่าน ต้องแก้ให้ตรงกับโจทย์
R5 solver และ verifier เรียกฟังก์ชัน check ตัวเดียวกันจาก packages/rules แต่ verifier ห้ามใช้ข้อมูลภายในของ solver
R6 ถ้า solver จัดไม่ได้ MUST ตอบ `infeasible` พร้อมรายการสาเหตุ ห้ามส่งตารางที่ผิดกฎ
R8 seed: seed เดียวกัน ข้อมูลเดียวกัน ค่าตั้งค่าเดียวกัน ต้องได้ตารางเหมือนเดิมทุกแถว
   เทสต์ด้วยการรัน 3 ครั้งแล้วเทียบ hash ของผล
R9 solver หยุดด้วยเพดานจำนวนรอบ ไม่ใช่เวลา และตอบ best-so-far พร้อมสถานะเสมอ
R10 ชุดใหญ่ (~600 รายการ) ต้องเสร็จโดยไม่ค้าง และ progress ต้องขยับด้วยค่าจริง
R11 คำขอพิเศษแต่ละข้อถูกแปลงเป็น { ครู/กลุ่ม, เงื่อนไข, ระดับ: must|try|noop } และ must = hard
    try = soft มีน้ำหนัก noop ต้องมีเหตุผล (จริงอยู่แล้ว / ไม่พบครูในข้อมูล) ห้ามทิ้งโดยไม่บอก
R7 เงื่อนไขใหม่จากกรรมการในวันแข่งต้องเพิ่มได้โดยแก้ rules.json หรือฟอร์มในหน้า admin โดยไม่แก้โค้ด solver

## 7. Motion

M1 Motion ต้องช่วยให้เข้าใจ ไม่ใช้เพื่อประดับ
M2 อนุญาตเฉพาะรายการนี้:
   - เข้าหน้า: opacity และ translateY ไม่เกิน 12px นาน 240–320ms
   - ช่องตารางย้ายตำแหน่งหลังลากวาง: layout animation 300ms
   - รายการเข้า: stagger ไม่เกิน 40ms ต่อรายการ และไม่เกิน 8 รายการ
   - ปุ่มและการ์ดตอน hover/focus: ยกไม่เกิน 2px, เปลี่ยนเงาหรือขอบ
   - แถบความคืบหน้า: เลื่อนตามค่าจริงจาก SSE
   - ไดอะแกรมสถาปัตยกรรม: จุดข้อมูลวิ่งตามเส้นทาง (หน้าอธิบายระบบเท่านั้น)
M3 MUST animate เฉพาะ `transform` และ `opacity`
M4 NEVER animation ที่ทำให้ผู้ใช้รอเกิน 600ms ก่อนกดต่อได้
M5 NEVER animation วนไม่รู้จบบนหน้าที่แสดงข้อมูลตาราง
M6 NEVER animate layout เมื่อมีองค์ประกอบเกิน 200 ชิ้น
M7 ทุก animation ต้องผ่านฟังก์ชันกลาง `useMotionPreset()` ที่เดียว
M8 เมื่อ `prefers-reduced-motion: reduce` MUST ปิด transform ทั้งหมด เหลือแค่ opacity หรือไม่มีเลย
M9 ค่าเวลาและ easing อยู่ใน tokens.css ห้ามเขียนตัวเลขในคอมโพเนนต์

## 9. ตรวจก่อนส่งงาน (Definition of Done)

รันตามลำดับ ทุกคำสั่งต้องผ่าน และ MUST แปะผลจริง

```
npm run lint
npm run typecheck
npm test
npm run test:api
npm run build
```

งานใหญ่ (เพิ่มหน้า เพิ่มกฎ แก้ solver) เพิ่มอีก: `npm run test:e2e`

ทดสอบเฉพาะระบบจัดตาราง (ต้องผ่านก่อนบอกว่าหน้า 3 เสร็จ):
D6 ไฟล์ตัวอย่างขนาดใหญ่ (~600 รายการ) จัดเสร็จ ไม่ค้าง ชนเป็น 0 จัดครบทุกรายการ
D7 seed เดิม 3 ครั้ง ได้ hash ผลเหมือนกัน
D8 กดยกเลิกกลางคัน แล้วจัดใหม่ได้ ไม่มี worker ค้าง
D9 ไฟล์ที่จงใจใส่ข้อมูลผิด (รหัสครูซ้ำ, กลุ่มไม่มีห้องจุพอ) ถูกรายงานครบในครั้งเดียว
D10 ส่งออก Excel แล้วอ่านกลับด้วยตัวตรวจ ผลเท่าเดิม และหัวคอลัมน์ตรงตัวอักษร

เช็กด้วยตาเพิ่ม 5 ข้อ:
D1 ไม่มี error สีแดงใน console
D2 ปิดอินเทอร์เน็ตแล้วโหลดหน้าได้ ฟอนต์ไม่เปลี่ยน
D3 เปิด reduced motion แล้วไม่มีการเคลื่อนไหว
D4 หน้าจอกว้าง 1440px และ 390px ไม่มีข้อความทับกันหรือถูกตัด
D5 ข้อมูลที่เห็นบนหน้าจอตรงกับข้อมูลใน API (เปิด Network ตรวจ 1 รายการ)

## 10. เมื่อไรต้อง STOP แล้วถามคน

S1 ไม่มีข้อมูลที่งานต้องใช้
S2 กฎในโจทย์ตีความได้มากกว่าหนึ่งแบบ (เช่น "ครูไม่มีคาบพัก" หมายถึงอะไร)
S3 ต้องเพิ่มไลบรารีหรือเปลี่ยนเวอร์ชัน
S4 ต้องแก้ packages/contract
S5 เทสต์ล้มเหลวเกิน 3 รอบ
S6 ข้อมูลจริงมีโครงสร้างต่างจากไฟล์ตัวอย่าง
S7 งานที่สั่งต้องลบหรือย้ายไฟล์
S8 ต้องใช้ข้อมูลจากอินเทอร์เน็ต
S9 ยังไม่มีไฟล์ตัวอย่างรูปแบบส่งออกจากกรรมการ แต่งานต้องเขียนส่วนส่งออก
S10 ความหมายของ ท-ป-น ในข้อมูลจริงไม่ตรงกับ F3 (เช่น ทฤษฎีมากกว่า 1 ช่วง)

วิธี STOP: เขียนคำถามเดียวที่ตอบได้สั้น ๆ พร้อมตัวเลือก 2–3 ข้อ แล้วหยุด

## 11. รูปแบบรายงานของ AI (ใช้ทุกครั้ง ห้ามเปลี่ยนหัวข้อ)

```
งาน: <ชื่องานหนึ่งบรรทัด>
ไฟล์ที่แก้: <รายชื่อไฟล์>

const EB={},NB={};

function viewArch(){
  return head('สถาปัตยกรรมระบบ','ชี้หรือแตะกล่องเพื่อดูหน้าที่และราคาที่จ่าย เลือกสถานการณ์เพื่อดูข้อมูลไหลทีละขั้น เส้นประที่เคลื่อนไหวคือทิศทางของข้อมูล')+

function buildArch(root){
  const svg=$('#arch',root);
  svg.innerHTML='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="context-stroke"/></marker></defs>';
  [[16,'ผู้ใช้'],[210,'ขอบระบบ'],[710,'งานเบื้องหลัง'],[930,'ข้อมูล']].forEach(([x,t])=>{el('text',{x,y:14,class:'col'},svg).textContent=t});
  EDGES.forEach(([id,from,to,d],i)=>{
    const g=el('g',{class:'edge'},svg);g.dataset.s='on';
    el('path',{d,class:'line','marker-end':'url(#ah)',id:'ep-'+id},g);
    const c=el('circle',{r:3.6,class:'pk',cx:0,cy:0},g);
    const am=el('animateMotion',{dur:(2.6+(i%4)*.4)+'s',repeatCount:'indefinite',begin:'-'+(i*.37).toFixed(2)+'s'},c);
    el('mpath',{href:'#ep-'+id},am);
    EB[id]={id,from,to,g};
  });
  ELABELS.forEach(([x,y,t])=>{el('text',{x,y,class:'elab'},svg).textContent=t});
  NODES.forEach(([id,x,y,w,h,t,s,kind,parent])=>{
    const g=el('g',{class:'nd k-'+kind,tabindex:0,role:'button','aria-label':t+' '+s},svg);
    el('rect',{x,y,width:w,height:h,rx:kind==='core'?18:(kind==='mod'?10:13)},g);
    const ty=kind==='core'?y+20:y+h/2-3, sy=kind==='core'?y+38:ty+15;
    const tx=kind==='core'?x+14:x+12;
    const a=el('text',{x:tx,y:ty,class:'t'},g);a.textContent=t;
    const b=el('text',{x:tx,y:sy,class:'s'},g);b.textContent=s;
    NB[id]={g,parent,kind,t,s};
    g.addEventListener('mouseenter',()=>{st.hv=id;paint()});
    g.addEventListener('mouseleave',()=>{st.hv=null;paint()});
    g.addEventListener('focus',()=>{st.hv=id;paint()});
    g.addEventListener('blur',()=>{st.hv=null;paint()});
    const tog=e=>{e.stopPropagation();st.pin=st.pin===id?null:id;paint()};
    g.addEventListener('click',tog);
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog(e)}});
  });
  svg.addEventListener('click',()=>{st.pin=null;paint()});
  if(reduce)svg.pauseAnimations();
  const box=$('#scn',root);
  Object.keys(SCN).forEach(k=>{
    const b=document.createElement('button');b.className='btn';b.textContent=SCN[k].name;b.dataset.k=k;
    b.addEventListener('click',()=>{st.scn=k;st.step=0;st.playing=!reduce;paint();sync()});
    box.appendChild(b);
  });
  $('#prev',root).addEventListener('click',()=>move(-1));
  $('#next',root).addEventListener('click',()=>move(1));
  $('#play',root).addEventListener('click',()=>{st.playing=!st.playing;paint();sync()});
  st.playing=!reduce;paint();sync();
}
function move(d){if(st.scn==='all')return;const L=SCN[st.scn].steps.length;st.step=(st.step+d+L)%L;paint()}
function sync(){clearInterval(timer);timer=null;if(st.playing&&st.scn!=='all'&&state.archVisible&&!reduce)timer=setInterval(()=>move(1),2300)}
function paint(){
  const f=st.hv||st.pin;const hot=new Set(),on=new Set(),nodes=new Set();
  if(f){const eid=NB[f].parent||f;EDGES.forEach(([id,a,b])=>{if(a===eid||b===eid){on.add(id);nodes.add(a);nodes.add(b)}});nodes.add(f);nodes.add(eid)}
  else if(st.scn==='all'){EDGES.forEach(e=>on.add(e[0]));NODES.forEach(n=>nodes.add(n[0]))}
  else{SCN[st.scn].steps.forEach((s,i)=>{const e=EB[s[0]];if(i<st.step)on.add(s[0]);if(i===st.step)hot.add(s[0]);if(i<=st.step){nodes.add(e.from);nodes.add(e.to);(s[2]||[]).forEach(m=>nodes.add(m))}})}
  EDGES.forEach(([id])=>{EB[id].g.dataset.s=hot.has(id)?'hot':on.has(id)?'on':'dim'});
  Object.keys(NB).forEach(id=>{NB[id].g.classList.toggle('dim',!nodes.has(id));NB[id].g.classList.toggle('pin',st.pin===id)});
  $$('#scn .btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===st.scn)));
  const pl=$('#play');if(pl){pl.textContent=st.playing?'หยุด':'เล่น';pl.disabled=st.scn==='all'}
  [$('#prev'),$('#next')].forEach(b=>{if(b)b.disabled=st.scn==='all'});
  const ol=$('#steps');
  if(st.scn==='all'){ol.innerHTML='<li style="display:block">เลือกสถานการณ์ด้านบนเพื่อดูข้อมูลไหลทีละขั้น หรือชี้กล่องใดก็ได้เพื่อดูเส้นทางที่เกี่ยวข้อง</li>';ol.style.counterReset='none'}
  else{ol.innerHTML=SCN[st.scn].steps.map((s,i)=>`<li class="${i===st.step?'on':i<st.step?'done':''}">${s[1]}</li>`).join('')}
  let show=f;
  if(!show&&st.scn!=='all')show=EB[SCN[st.scn].steps[st.step][0]].to;
  const d=$('#det');
  if(!show){d.innerHTML='<div class="eyebrow">รายละเอียด</div><p style="color:var(--ink-2);margin-top:6px">ชี้หรือแตะกล่องในไดอะแกรมเพื่อดูหน้าที่ของแต่ละส่วน</p>'}
  else{const n=NB[show],x=DETAIL[show];d.innerHTML=`<div class="eyebrow">${KIND[n.kind]}</div><h3 style="font-size:19px;line-height:1.4;margin:4px 0 8px">${n.t}</h3><p style="color:var(--ink-2)">${x[0]}</p><p style="margin-top:10px;color:var(--ink-3);font-size:13.5px"><b>ข้อควรรู้:</b> ${x[1]}</p>`}
}

let simId=0;
function curvePath(){
  const pts=[];for(let i=0;i<=80;i++){const x=44+i*(456/80);const v=.05+.95*Math.exp(-i/14)+Math.sin(i*1.7)*.012*(1-i/80);pts.push((i?'L':'M')+x.toFixed(1)+','+(184-160*Math.max(v,.03)).toFixed(1))}
  return pts.join(' ');
}

      ${[0,1,2,3].map(i=>`<line class="gr" x1="44" x2="500" y1="${24+i*53.3}" y2="${24+i*53.3}"/>`).join('')}

      <line x1="${44+22*5.7}" x2="${44+22*5.7}" y1="16" y2="184" stroke="var(--hot)" stroke-dasharray="4 4"/>

      <text x="44" y="204">รอบการปรับปรุง →</text><text x="360" y="204">คะแนนรวม (ต่ำ = ดี)</text>
    </svg>
    <p class="m" style="font-size:12.5px;color:var(--ink-3)">ภาพจำลองรูปแบบกราฟ ไม่ใช่ผลจริง หน้าจริงจะวาดจากประวัติคะแนนที่ solver บันทึกไว้ในแต่ละ run</p></div>
   <div class="glass pad"><div class="sec" style="margin:0 0 6px">ขั้นที่ 5 แยกเป็น 7 ช่วง</div><ol class="steps">${sv}</ol>
    <div class="card" style="padding:12px 0 0"><div class="k">ฟังก์ชันประเมิน</div><div class="p mono" style="margin-top:4px">score = 1,000,000 × hard + Σ (น้ำหนัก × soft)</div><div class="m">เผยแพร่ได้เมื่อ hard = 0 เท่านั้น</div></div></div></div>
  <div class="sec">เมื่อเกิดความผิดพลาด ระบบทำอะไร</div>
  <div class="glass pad scroll"><table><thead><tr><th>เหตุการณ์</th><th>สิ่งที่ระบบทำ</th></tr></thead><tbody>${fl}</tbody></table></div>`;
}
function initPipeline(root){
  const btn=$('#sim',root),cards=$$('.stg',root),curve=$('#curve',root);
  const setAll=v=>cards.forEach(c=>{if(v)c.dataset.st=v;else delete c.dataset.st});
  btn.addEventListener('click',async()=>{
    const my=++simId;setAll(null);
    curve.style.transition='none';curve.style.strokeDashoffset=reduce?0:1;void curve.getBoundingClientRect();
    btn.disabled=true;
    for(let i=0;i<cards.length;i++){
      cards[i].dataset.st='run';
      if(i===4&&!reduce){curve.style.transition='stroke-dashoffset 3s linear';curve.style.strokeDashoffset=0;await sleep(3100)}
      else await sleep(reduce?150:750);
      if(my!==simId)return;
      cards[i].dataset.st='ok';
    }
    curve.style.strokeDashoffset=0;btn.disabled=false;btn.textContent='จำลองอีกครั้ง';
  });
}

  <div class="glass pad"><ol class="steps"><li><div><b>ครบ 6 หน้าแบบพอใช้</b><br><span style="color:var(--ink-3)">นำเข้า → จัดตาราง (ชนเป็น 0 บนชุดทดลอง) → ดูตาราง → ส่งออก Excel ก่อน แล้วค่อยทำคำขอพิเศษ และหน้า AI</span></div></li><li><div><b>ขึ้นออนไลน์</b><br><span style="color:var(--ink-3)">ตรวจว่าเปิดได้ทั้งคอมพิวเตอร์และมือถือ (2 คะแนน)</span></div></li><li><div><b>ปรับทีละหน้าตามคะแนน</b><br><span style="color:var(--ink-3)">หน้า 3 (25) → หน้า 4 (23) → หน้า 5 (16) → หน้า 1 (11)</span></div></li></ol></div>`;
}
function initPages(root){
  const bars=$$('.rb',root),cards=$$('.pg',root);
  const hl=n=>{cards.forEach(c=>c.classList.toggle('dim',n&&c.dataset.n!==n))};
  bars.forEach(b=>{b.tabIndex=0;b.addEventListener('mouseenter',()=>hl(b.dataset.n));b.addEventListener('mouseleave',()=>hl(null));b.addEventListener('focus',()=>hl(b.dataset.n));b.addEventListener('blur',()=>hl(null))});

/* ===== rules ===== */
function viewRules(){
  const types=['ทั้งหมด','hard','soft'];

  `<div class="glass pad"><div class="tools" id="rf" style="margin-bottom:12px">${types.map((t,i)=>`<button class="btn" data-t="${t}" aria-pressed="${i===0}">${t}</button>`).join('')}
    <input id="rq" type="search" placeholder="ค้นหากฎ เช่น ครู ห้อง พัก" aria-label="ค้นหากฎ" style="font:inherit;padding:8px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass-hi);color:var(--ink);min-width:0;flex:1 1 180px">
    <span class="pill mute" id="rc"></span></div>
   <div class="scroll"><table><thead><tr><th>รหัส</th><th>ชื่อกฎ</th><th>ชนิด</th><th>ขอบเขต</th><th>ที่มา</th></tr></thead><tbody id="rb"></tbody></table></div></div>
  <div class="sec">คำถามที่ต้องยืนยันกับกรรมการ</div>
  <div class="grid g3">${oq}</div>
  <div class="card"><div class="m" style="margin:0">ทุกข้อมีค่าตั้งต้นที่ปรับได้ ระบบจึงไม่ต้องหยุดรอคำตอบ แต่ผลลัพธ์ต้องระบุว่าใช้ค่าตั้งต้นข้อใด</div></div>`;
}
function initRules(root){
  const tb=$('#rb',root),cnt=$('#rc',root),q=$('#rq',root);let t='ทั้งหมด';
  function draw(){
    const k=q.value.trim().toLowerCase();
    const list=RULES.filter(r=>(t==='ทั้งหมด'||r[2]===t)&&(!k||r.join(' ').toLowerCase().includes(k)));
    cnt.textContent=list.length+' / '+RULES.length+' ข้อ';
    tb.innerHTML=list.map((r,i)=>`<tr class="rr" data-i="${i}" tabindex="0" style="cursor:pointer"><td class="mono">${r[0]}</td><td>${r[1]}</td><td><span class="pill ${r[2]==='hard'?'bad':'warn'}">${r[2]}</span></td><td>${r[3]}</td><td>${r[4]}</td></tr>
    <tr class="rx" hidden><td colspan="5"><div class="grid g2"><div><div class="k">เกณฑ์ที่เกี่ยวข้อง</div><div class="mono">${r[5]}</div><div class="k" style="margin-top:10px">พารามิเตอร์</div><pre class="code">${esc(r[6])}</pre></div><div><div class="k">Verifier ตรวจอย่างไร</div><p>${r[7]}</p></div></div></td></tr>`).join('')||'<tr><td colspan="5">ไม่พบกฎที่ตรงกับคำค้น</td></tr>';
  }
  tb.addEventListener('click',e=>{const tr=e.target.closest('.rr');if(!tr)return;const x=tr.nextElementSibling;x.hidden=!x.hidden});
  tb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const tr=e.target.closest('.rr');if(tr){e.preventDefault();tr.nextElementSibling.hidden=!tr.nextElementSibling.hidden}}});
  $('#rf',root).addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(!b)return;t=b.dataset.t;$$('#rf button',root).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw()});
  q.addEventListener('input',draw);draw();
}

/* ===== data ===== */
function copyText(text,note){
  const done=()=>{note.textContent='คัดลอกแล้ว';setTimeout(()=>{note.textContent=''},1800)};
  const fb=()=>{try{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();note.textContent=ok?'คัดลอกแล้ว':'เลือกข้อความแล้วคัดลอกเอง';setTimeout(()=>{note.textContent=''},2400)}catch(_){note.textContent='คัดลอกไม่ได้ ให้เลือกข้อความเอง'}};
  try{navigator.clipboard.writeText(text).then(done,fb)}catch(_){fb()}
}
function viewData(){
  const ents=ENTS.map((e,i)=>`<div class="card glass ent" data-n="${e[0]}" tabindex="0"><span class="pill mute">${e[1]}</span><h4>${e[0]}</h4>${e[2].map(f=>`<div class="f"><span>${f[0]}</span><em>${f[1]}</em></div>`).join('')}</div>`).join('');
  const rels=RELS.map(r=>`<div class="card"><div class="k mono">${r[0]}</div><div class="m">${r[1]}</div></div>`).join('');
  const tabs=Object.keys(CONTRACT);
  const names={problem:'Problem (ข้อมูลเข้า)',solution:'Solution (ผลลัพธ์)',error:'Error (ข้อผิดพลาด)'};
  return head('ข้อมูลและสัญญา','ชี้เอนทิตีเพื่อดูตารางที่เกี่ยวข้อง ส่วนสัญญา (contract) คือรูปแบบข้อมูลกลางที่ทุกส่วนต้องใช้ร่วมกัน')+
  `<div class="grid g3" id="ents">${ents}</div>
  <div class="sec">ความสัมพันธ์ที่สำคัญ</div><div class="grid g2">${rels}</div>
  <div class="sec">สัญญาข้อมูล (packages/contract)</div>
  <div class="glass pad"><div class="tools" style="margin-bottom:12px"><div class="tabs" id="ct">${tabs.map((t,i)=>`<button class="btn" data-k="${t}" aria-pressed="${i===0}">${names[t]||t}</button>`).join('')}</div><button class="btn" id="cc">คัดลอก</button><span class="copy-ok" id="cn" role="status"></span></div>
   <span class="pill warn" style="margin-bottom:8px">ตัวอย่างรูปแบบ ตัวเลขเป็นค่าสมมติ</span>
   <pre class="code" id="cp" style="margin-top:8px"></pre></div>`;
}
function initData(root){
  const cards=$$('.ent',root);
  const rel=n=>{const e=ENTS.find(x=>x[0]===n);return new Set([n,...(e?e[3]:[]),...ENTS.filter(x=>x[3].includes(n)).map(x=>x[0])])};
  const on=n=>{const s=rel(n);cards.forEach(c=>{c.classList.toggle('dim',!s.has(c.dataset.n));c.classList.toggle('rel',c.dataset.n!==n&&s.has(c.dataset.n))})};
  const off=()=>cards.forEach(c=>c.classList.remove('dim','rel'));
  cards.forEach(c=>{c.addEventListener('mouseenter',()=>on(c.dataset.n));c.addEventListener('mouseleave',off);c.addEventListener('focus',()=>on(c.dataset.n));c.addEventListener('blur',off)});
  let cur=Object.keys(CONTRACT)[0];const pre=$('#cp',root);
  const show=()=>{pre.textContent=CONTRACT[cur]};show();
  $('#ct',root).addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;cur=b.dataset.k;$$('#ct button',root).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));show()});
  $('#cc',root).addEventListener('click',()=>copyText(CONTRACT[cur],$('#cn',root)));
}

/* ===== ops ===== */
const LS='slotline-runbook-v1';
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(_){return {}}}
function lsSet(o){try{localStorage.setItem(LS,JSON.stringify(o))}catch(_){}}
function viewOps(){
  const sv=SERVICES.map(s=>`<div class="card glass"><div class="t mono">${s[0]}</div><div class="p">${s[1]}</div></div>`).join('');
  const roles=ROLES.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(c=>`<td>${c==='ไม่ได้'?'<span class="pill mute">ไม่ได้</span>':`<span class="pill">${c}</span>`}</td>`).join('')}</tr>`).join('');
  const tg=TARGETS.map(t=>`<div class="card glass"><div class="k">${t[0]}</div><div class="t mono">${t[1]}</div></div>`).join('');

  const dots=Array.from({length:10},(_,i)=>`<i style="animation-delay:-${(i*.32).toFixed(2)}s"></i>`).join('');
  return head('วันแข่งและการใช้งาน','บริการ 5 ตัวใน docker compose สิทธิ์ตามบทบาท เป้าหมายประสิทธิภาพ และรายการตรวจก่อนวันแข่ง (ติ๊กแล้วจดจำในเบราว์เซอร์นี้)')+
  `<div class="grid g3">${sv}</div>
  <div class="glass pad" style="margin-top:14px"><div class="k">การคัดลอกข้อมูลจากฐานหลักไปสำรอง (ภาพประกอบ)</div><div class="rep" aria-hidden="true">${dots}</div></div>
  <div class="sec">สิทธิ์ตามบทบาท</div><div class="glass pad scroll"><table><thead><tr><th>การกระทำ</th><th>admin</th><th>ครู</th><th>นักเรียน</th></tr></thead><tbody>${roles}</tbody></table></div>
  <div class="sec">เป้าหมายประสิทธิภาพ <span class="pill warn">เป้าหมายออกแบบ ยังไม่ได้วัด</span></div><div class="grid g3">${tg}</div>
  <div class="sec">รายการตรวจ</div><div class="glass pad"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span class="k">ความคืบหน้า</span><b class="mono" id="rp">0%</b></div><div class="meter"><i id="rm"></i></div></div>
  <div class="grid g2" style="margin-top:14px">${rb}</div>`;
}
function initOps(root){
  const saved=lsGet();const boxes=$$('input[data-id]',root);
  const upd=()=>{const n=boxes.filter(b=>b.checked).length,p=Math.round(n/boxes.length*100);$('#rp',root).textContent=p+'%';$('#rm',root).style.width=p+'%'};
  boxes.forEach(b=>{b.checked=!!saved[b.dataset.id];b.addEventListener('change',()=>{const s=lsGet();s[b.dataset.id]=b.checked;lsSet(s);upd()})});
  upd();
}

  $('#ap',root).textContent=md;$('#al',root).textContent=md.split('\n').length+' บรรทัด';
  $('#ac',root).addEventListener('click',()=>copyText(md,$('#an',root)));

/* ===== router ===== */
const VIEWS={overview:[viewOverview,initOverview],pages:[viewPages,initPages],architecture:[viewArch,buildArch],pipeline:[viewPipeline,initPipeline],rules:[viewRules,initRules],data:[viewData,initData],stack:[viewStack,null],ops:[viewOps,initOps],decisions:[viewDecisions,null],'ai-rules':[viewAI,initAI]};
const done=new Set();
function route(){
  let h=(location.hash||'').replace('#','');if(!VIEWS[h])h='overview';
  state.view=h;
  $$('.view').forEach(v=>{v.hidden=v.dataset.view!==h});
  $$('#nav a').forEach(a=>{const on=a.dataset.go===h;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const sec=$(`.view[data-view="${h}"]`);
  if(!done.has(h)){
    sec.innerHTML=VIEWS[h][0]();
    try{if(VIEWS[h][1])VIEWS[h][1](sec)}catch(e){console.error(e);sec.insertAdjacentHTML('beforeend','<div class="card"><div class="m">ส่วนโต้ตอบของหน้านี้โหลดไม่สำเร็จ</div></div>')}
    done.add(h);
  }
  state.archVisible=h==='architecture';
  if(done.has('architecture'))sync();
  window.scrollTo(0,0);
  document.title='Slotline System Design';
}
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(timer);timer=null}else sync()});
route();
})();
